name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge into main is re-verified here; when that passes, the CD workflow
  # (cd.yml) deploys it. Running CI by hand only re-runs the checks.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels that PR's run still in progress. Runs on
# main are never cancelled: CD deploys only after CI passes on a merge commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chronos_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d chronos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest app/tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chronos_test
          ENVIRONMENT: ci
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chronos_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
      - run: npm run check:offline --prefix frontend
